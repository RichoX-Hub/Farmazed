<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Farmazed — Mis Expedientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --fz-blue:#1B4F8A; --fz-navy:#0F3260; --fz-green:#3A7D44; }
    body  { background:#f0f4fa; font-family:'Segoe UI',sans-serif; }
    .navbar { background:var(--fz-navy); }
    .case-card { border:none; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,.07); transition:.2s; cursor:pointer; }
    .case-card:hover { box-shadow:0 4px 24px rgba(0,0,0,.13); transform:translateY(-2px); }
    .badge-draft      { background:#e9ecef; color:#495057; }
    .badge-submitted  { background:#cfe2ff; color:#084298; }
    .badge-in_review  { background:#fff3cd; color:#664d03; }
    .badge-faddi_ready{ background:#d1e7dd; color:#0a3622; }
    .badge-approved   { background:#198754; color:#fff; }
    .badge-observed   { background:#f8d7da; color:#842029; }
    .icon-big { font-size:2.5rem; opacity:.15; }
    .progress { height:6px; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark px-4 py-3">
  <a class="navbar-brand fw-bold" href="/portal/dashboard.html">Farmazed</a>
  <div class="d-flex align-items-center gap-3">
    <span class="text-white-50 small" id="user-name"></span>
    <button class="btn btn-outline-light btn-sm" id="btn-logout">Salir</button>
  </div>
</nav>

<div class="container py-5" style="max-width:900px">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="fw-bold mb-0">Mis Expedientes</h4>
      <p class="text-muted small mb-0">Gestiona tus solicitudes de registro sanitario</p>
    </div>
    <a href="/portal/nuevo.html" class="btn btn-primary px-4">
      <i class="bi bi-plus-lg me-2"></i>Nuevo Expediente
    </a>
  </div>

  <!-- Stats row -->
  <div class="row g-3 mb-4" id="stats-row">
    <div class="col-6 col-md-3">
      <div class="card border-0 shadow-sm text-center p-3">
        <div class="fw-bold fs-4" id="stat-total">—</div>
        <div class="small text-muted">Total</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card border-0 shadow-sm text-center p-3">
        <div class="fw-bold fs-4 text-warning" id="stat-progress">—</div>
        <div class="small text-muted">En Proceso</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card border-0 shadow-sm text-center p-3">
        <div class="fw-bold fs-4 text-info" id="stat-faddi">—</div>
        <div class="small text-muted">En FADDI</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card border-0 shadow-sm text-center p-3">
        <div class="fw-bold fs-4 text-success" id="stat-approved">—</div>
        <div class="small text-muted">Aprobados</div>
      </div>
    </div>
  </div>

  <!-- Cases list -->
  <div id="cases-container">
    <div class="text-center py-5">
      <div class="spinner-border text-primary"></div>
    </div>
  </div>
</div>

<script type="module">
  import { requireLogin, logout } from './js/auth.js';
  import api from './js/api.js';

  const STATUS_LABEL = {
    draft:          { label: 'Borrador',          cls: 'badge-draft' },
    submitted:      { label: 'Enviado',           cls: 'badge-submitted' },
    in_review:      { label: 'En Revisión',       cls: 'badge-in_review' },
    pending_docs:   { label: 'Docs. Pendientes',  cls: 'badge-observed' },
    faddi_ready:    { label: 'Listo para FADDI',  cls: 'badge-faddi_ready' },
    faddi_submitted:{ label: 'En FADDI',          cls: 'badge-submitted' },
    approved:       { label: 'Aprobado',          cls: 'badge-approved' },
    observed:       { label: 'Observado',         cls: 'badge-observed' },
  };
  const TRAMITE_ICON = { medicamentos:'💊', cosmeticos:'🧴', higienicos:'🧼', plaguicidas:'🌿', excepcion:'🚨', publicidad:'📢' };

  async function init() {
    const user = await requireLogin();
    document.getElementById('user-name').textContent = user.displayName || user.email;
    document.getElementById('btn-logout').addEventListener('click', logout);
    await loadCases();
  }

  async function loadCases() {
    const container = document.getElementById('cases-container');
    try {
      const { cases } = await api.listCases();

      // Stats
      document.getElementById('stat-total').textContent    = cases.length;
      document.getElementById('stat-progress').textContent = cases.filter(c => ['draft','submitted','in_review','pending_docs'].includes(c.status)).length;
      document.getElementById('stat-faddi').textContent    = cases.filter(c => c.status === 'faddi_submitted').length;
      document.getElementById('stat-approved').textContent = cases.filter(c => c.status === 'approved').length;

      if (!cases.length) {
        container.innerHTML = `
          <div class="text-center py-5 text-muted">
            <div style="font-size:4rem">📋</div>
            <h5 class="mt-3">No tienes expedientes aún</h5>
            <p>Crea tu primer expediente de registro sanitario.</p>
            <a href="/portal/nuevo.html" class="btn btn-primary mt-2">Crear Expediente</a>
          </div>`;
        return;
      }

      container.innerHTML = cases.map(c => {
        const st   = STATUS_LABEL[c.status] || { label: c.status, cls: 'badge-draft' };
        const icon = TRAMITE_ICON[c.tramiteType] || '📋';
        const date = c.updatedAt ? new Date(c.updatedAt).toLocaleDateString('es-PA', { day:'2-digit', month:'short', year:'numeric' }) : '—';
        return `
          <div class="case-card card mb-3 p-0" onclick="window.location.href='/portal/nuevo.html?caseId=${c.id}'">
            <div class="card-body py-3 px-4 d-flex align-items-center gap-3">
              <div class="fs-2">${icon}</div>
              <div class="flex-grow-1">
                <div class="d-flex align-items-center gap-2 flex-wrap">
                  <span class="fw-semibold">${c.productName || '(sin nombre de producto)'}</span>
                  <span class="badge ${st.cls} rounded-pill">${st.label}</span>
                  ${c.tramiteType === 'medicamentos' ? `<span class="badge bg-light text-dark border small">${c.tipoRegistro || 'Regular'}</span>` : ''}
                </div>
                <div class="small text-muted mt-1">
                  ${c.tramiteType?.charAt(0).toUpperCase() + c.tramiteType?.slice(1)} &nbsp;·&nbsp; Actualizado: ${date}
                </div>
              </div>
              <div class="text-muted">
                <i class="bi bi-chevron-right"></i>
              </div>
            </div>
          </div>`;
      }).join('');
    } catch (err) {
      container.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
    }
  }

  init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Farmazed — Acceso al Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --fz-blue:#1B4F8A; --fz-navy:#0F3260; --fz-green:#3A7D44; }
    body { background:linear-gradient(135deg,var(--fz-navy),var(--fz-blue)); min-height:100vh; display:flex; align-items:center; }
    .card { border:none; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.25); }
    .logo { font-family:'Georgia',serif; color:var(--fz-navy); font-size:1.7rem; font-weight:700; }
    .logo span { color:var(--fz-green); }
    .btn-primary { background:var(--fz-blue); border-color:var(--fz-blue); }
    .btn-primary:hover { background:var(--fz-navy); border-color:var(--fz-navy); }
    .nav-tabs .nav-link.active { color:var(--fz-blue); border-bottom:3px solid var(--fz-blue); font-weight:600; }
    .nav-tabs .nav-link { color:#666; }
  </style>
</head>
<body>
<div class="container" style="max-width:440px">
  <div class="card p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="logo">Farma<span>zed</span></div>
      <p class="text-muted small mt-1">Portal de Gestión Regulatoria</p>
    </div>

    <ul class="nav nav-tabs mb-4" id="authTabs">
      <li class="nav-item flex-fill text-center">
        <button class="nav-link active w-100" data-tab="login">Iniciar Sesión</button>
      </li>
      <li class="nav-item flex-fill text-center">
        <button class="nav-link w-100" data-tab="register">Registrarse</button>
      </li>
    </ul>

    <div id="alert-area"></div>

    <!-- LOGIN -->
    <form id="login-form">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Correo electrónico</label>
        <input type="email" class="form-control" id="login-email" required autocomplete="email">
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold">Contraseña</label>
        <input type="password" class="form-control" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2" id="btn-login">
        Ingresar
      </button>
      <p class="text-center mt-3 mb-0 small">
        <a href="#" class="text-muted">¿Olvidaste tu contraseña?</a>
      </p>
    </form>

    <!-- REGISTER (hidden) -->
    <form id="register-form" class="d-none">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Nombre completo</label>
        <input type="text" class="form-control" id="reg-name" required autocomplete="name">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Correo electrónico</label>
        <input type="email" class="form-control" id="reg-email" required autocomplete="email">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Contraseña <span class="text-muted">(mín. 8 caracteres)</span></label>
        <input type="password" class="form-control" id="reg-password" required minlength="8" autocomplete="new-password">
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold">Confirmar contraseña</label>
        <input type="password" class="form-control" id="reg-confirm" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2" id="btn-register">
        Crear cuenta
      </button>
    </form>

    <p class="text-center text-muted small mt-4 mb-0">
      ¿Necesitas ayuda? <a href="mailto:info@farmazed.com">info@farmazed.com</a>
    </p>
  </div>
</div>

<script type="module">
  import { login, register } from './js/auth.js';
  import { auth } from './js/auth.js';
  import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';

  // If already logged in, redirect
  onAuthStateChanged(auth, user => { if (user) window.location.href = '/portal/dashboard.html'; });

  // Tab switching
  document.querySelectorAll('[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-tab]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('login-form').classList.toggle('d-none',    btn.dataset.tab !== 'login');
      document.getElementById('register-form').classList.toggle('d-none', btn.dataset.tab !== 'register');
    });
  });

  function showAlert(msg, type = 'danger') {
    document.getElementById('alert-area').innerHTML =
      `<div class="alert alert-${type} py-2 small">${msg}</div>`;
  }
  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.innerHTML = loading ? '<span class="spinner-border spinner-border-sm me-2"></span>Espera...' : btn.dataset.orig || btn.innerHTML;
    if (!loading && !btn.dataset.orig) btn.dataset.orig = btn.innerHTML;
  }

  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    setLoading('btn-login', true);
    try {
      await login(document.getElementById('login-email').value, document.getElementById('login-password').value);
      window.location.href = '/portal/dashboard.html';
    } catch (err) {
      showAlert('Credenciales incorrectas. Verifica tu correo y contraseña.');
      setLoading('btn-login', false);
    }
  });

  document.getElementById('register-form').addEventListener('submit', async e => {
    e.preventDefault();
    const pwd = document.getElementById('reg-password').value;
    const cfm = document.getElementById('reg-confirm').value;
    if (pwd !== cfm) { showAlert('Las contraseñas no coinciden.'); return; }
    setLoading('btn-register', true);
    try {
      await register(
        document.getElementById('reg-email').value,
        pwd,
        document.getElementById('reg-name').value
      );
      window.location.href = '/portal/dashboard.html';
    } catch (err) {
      showAlert(err.message.includes('email-already-in-use') ? 'Ya existe una cuenta con ese correo.' : err.message);
      setLoading('btn-register', false);
    }
  });
</script>
</body>
</html>
